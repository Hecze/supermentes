<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grabador Supermentes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap">
<style>
  /* Pantalla completa: cámara al fondo, guion pegado arriba (cerca de la webcam), controles abajo. */
  :root {
    --fondo: #0f1412; --texto: #f4f1e8; --tenue: #9aa59f; --acento: #f5c84b; --rojo: #ff4d4d;
    --letra: "Lexend", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); font-family: var(--letra); overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  /* Marco 9:16: lo que queda dentro es lo que sale en TikTok. */
  #marco { position: fixed; top: 0; bottom: 0; left: 50%; aspect-ratio: 9 / 16; height: 100%; transform: translateX(-50%);
    box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); border: 2px dashed rgba(245,200,75,.6); pointer-events: none; }
  #guion { position: fixed; top: 0; left: 0; right: 0; padding: 18px 24px 26px; text-align: center;
    background: linear-gradient(rgba(0,0,0,.85), rgba(0,0,0,.6) 70%, transparent); }
  #actual { font-size: clamp(26px, 3.6vw, 46px); font-weight: 700; line-height: 1.2; max-width: 30ch; margin: 0 auto; text-wrap: balance; }
  #siguiente { margin-top: 10px; font-size: clamp(15px, 1.6vw, 20px); color: var(--tenue); max-width: 44ch; margin-inline: auto; }
  #paso { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--acento); margin-bottom: 8px; }
  #barra { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; justify-content: center; align-items: center;
    flex-wrap: wrap; padding: 16px; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  button { font: 600 16px var(--letra); border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer; background: #2a332f; color: var(--texto); }
  button.principal { background: var(--acento); color: #1a1a1a; }
  button.parar { background: var(--rojo); color: #fff; }
  button:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
  button[disabled] { opacity: .4; cursor: default; }
  #ir-editor { color: var(--acento); font-weight: 600; text-decoration: none; padding: 12px 8px; }
  #previa { position: fixed; right: 24px; top: 50%; transform: translateY(-50%); width: min(26vw, 340px);
    aspect-ratio: 16 / 9; object-fit: cover; border: 3px solid var(--acento); border-radius: 12px; background: #000; }
  #puntos { position: fixed; left: 50%; transform: translateX(-50%); bottom: 84px; display: flex; gap: 8px; }
  #puntos span { width: 14px; height: 14px; border-radius: 50%; background: #3a443f; border: 2px solid transparent; }
  #puntos span.hecha { background: var(--ok, #6fd39b); }
  #puntos span.actual { border-color: var(--acento); }
  #intentos { position: fixed; left: 24px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px;
    background: rgba(0,0,0,.6); padding: 12px; border-radius: 12px; max-height: 60vh; overflow: auto; }
  .intento { display: flex; gap: 6px; }
  .intento button { padding: 8px 12px; font-size: 14px; }
  .intento.elegido button:last-child { background: #6fd39b; color: #10251a; }
  button.ok { background: #6fd39b; color: #10251a; }
  #estado { font-size: 14px; color: var(--tenue); min-width: 9ch; text-align: center; font-variant-numeric: tabular-nums; }
  #estado.grabando::before { content: "● "; color: var(--rojo); }
  #cuenta { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22vmin; font-weight: 700; color: var(--acento);
    text-shadow: 0 4px 30px rgba(0,0,0,.6); pointer-events: none; }
  #ayuda { position: fixed; right: 16px; bottom: 86px; font-size: 13px; color: var(--tenue); text-align: right; line-height: 1.6; }
  kbd { font-family: var(--letra); border: 1px solid #4a554f; border-radius: 4px; padding: 0 5px; }
  #error { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 18px; background: var(--fondo); }
</style>
</head>
<body>
<video id="camara" autoplay muted playsinline></video>
<div id="marco"></div>

<div id="guion">
  <div id="paso"></div>
  <div id="actual"></div>
  <div id="siguiente"></div>
</div>

<video id="previa" playsinline hidden></video>
<div id="ayuda"><kbd>espacio</kbd> grabar / terminar frase · <kbd>Enter</kbd> me gusta · <kbd>R</kbd> repetir · <kbd>←</kbd> <kbd>→</kbd> moverte</div>

<div id="barra">
  <button id="atras">←</button>
  <button id="grabar" class="principal">● Grabar frase</button>
  <button id="repetir" hidden>↻ Otra vez</button>
  <button id="aceptar" class="ok" hidden>✓ Me gusta</button>
  <button id="adelante">→</button>
  <button id="guardar" class="principal" hidden>Guardar toma</button>
  <span id="estado"></span>
  <a id="ir-editor" href="editor.html">Ver mis tomas →</a>
</div>

<div id="puntos"></div>
<div id="intentos" hidden></div>

<div id="error" hidden></div>

<script>
// Guion del video de TikTok. Cada frase es un paso; las marcas de tiempo salen en cara-marcas.json.
// Las cifras salen de obsidian/DATOS.md: 7 h extra y 4 h preparando y evaluando (ENDO 2021, piso),
// "Tu clase de mañana, lista en 5 minutos" (obsidian/GTM.md), juegos y canciones (Sailer y Homner 2020, Odo 2021).
// Cada frase: texto (entre * va en amarillo en el montaje) y qué se ve debajo (null = la cara).
// Sin "tr", "dr" ni "gratis": a Harold le cuestan.
const FRASES = [
  { texto: 'Profe, ¿siete horas de más cada *semana*?', ve: null },
  { texto: 'Y más de la *mitad* se va en armar clases.', ve: null },
  { texto: 'Te enseño algo que hicimos para ti.', ve: null },
  { texto: 'Eliges tu grado, tu curso y tu *tema*.', ve: 'busqueda' },
  { texto: 'Y en segundos tienes tu *clase* lista, con el currículo.', ve: 'ficha' },
  { texto: '¿Quieres una *canción*? En cumbia o en huayno.', ve: 'cancion' },
  { texto: '¿Un *examen*? Con lo que le gusta a tu salón.', ve: 'examen' },
  { texto: '¿Un *juego*? Lo juegan desde el celular, sin cuenta.', ve: 'juego' },
  { texto: 'Tu clase de mañana, en *cinco minutos*.', ve: null },
  { texto: 'No cuesta nada. Únete en *supermentes.app*.', ve: null },
]
const limpio = (t) => t.replaceAll('*', '')

const $ = (id) => document.getElementById(id)
let paso = 0, flujo = null, grabador = null, partes = [], tipo = ''
// Todas las microtomas de cada frase se guardan; "elegida" dice cuál va al video (-1 = ninguna todavía).
const intentos = FRASES.map(() => [])
const elegida = FRASES.map(() => -1)
const clips = { get length() { return FRASES.length }, some: (f) => elegida.some((e, i) => f(e < 0 ? null : intentos[i][e])) }
let pendiente = null                  // la que se acaba de grabar y todavía no se aprobó

function pintar() {
  const f = FRASES[paso]
  $('paso').textContent = `Frase ${paso + 1} de ${FRASES.length}` + (elegida[paso] >= 0 ? ` · usando el intento ${elegida[paso] + 1}` : '')
  $('actual').textContent = limpio(f.texto)
  $('siguiente').textContent = FRASES[paso + 1] ? `Después: ${limpio(FRASES[paso + 1].texto)}` : 'Es la última frase'
  const grabando = !!grabador
  $('grabar').textContent = grabando ? '■ Terminar frase' : (intentos[paso].length ? '● Grabar otro intento' : '● Grabar frase')
  $('grabar').className = grabando ? 'parar' : 'principal'
  $('grabar').hidden = !!pendiente
  $('repetir').hidden = $('aceptar').hidden = !pendiente
  $('atras').disabled = grabando || !!pendiente || paso === 0
  $('adelante').disabled = grabando || !!pendiente || paso === FRASES.length - 1
  $('guardar').hidden = grabando || !!pendiente || clips.some((c) => !c)
  $('puntos').replaceChildren(...FRASES.map((_, i) => {
    const p = document.createElement('span')
    p.className = (elegida[i] >= 0 ? 'hecha ' : '') + (i === paso ? 'actual' : '')
    return p
  }))
  // Lista de intentos de esta frase: ver cualquiera y elegir cuál va.
  const lista = $('intentos')
  lista.replaceChildren()
  lista.hidden = !intentos[paso].length
  intentos[paso].forEach((blob, n) => {
    const fila = document.createElement('div')
    fila.className = 'intento' + (n === elegida[paso] ? ' elegido' : '')
    const ver = document.createElement('button')
    ver.textContent = `▶ Intento ${n + 1}`
    ver.onclick = () => verPrevia(blob)
    const usar = document.createElement('button')
    usar.textContent = n === elegida[paso] ? '✓ Este va' : 'Usar este'
    usar.disabled = !!grabador
    usar.onclick = () => { elegida[paso] = n; if (pendiente === blob) pendiente = null; pintar() }
    fila.append(ver, usar)
    lista.append(fila)
  })
}

async function encender() {
  try {
    flujo = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    })
    $('camara').srcObject = flujo
    tipo = ['video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find((t) => MediaRecorder.isTypeSupported(t)) || ''
  } catch (e) {
    $('error').hidden = false
    $('error').textContent = 'No pude usar la cámara o el micrófono. Permite el acceso en el candado de la barra de direcciones y recarga la página.'
  }
}

function verPrevia(blob) {
  const v = $('previa')
  v.hidden = false
  v.src = URL.createObjectURL(blob)
  v.currentTime = 0
  v.play().catch(() => {})
}

function grabarOParar() {
  if (!flujo || pendiente) return
  if (grabador) return grabador.stop()
  $('previa').hidden = true
  partes = []
  grabador = new MediaRecorder(flujo, { mimeType: tipo, videoBitsPerSecond: 12_000_000 })
  grabador.ondataavailable = (e) => e.data.size && partes.push(e.data)
  grabador.onstop = () => {
    grabador = null
    pendiente = new Blob(partes, { type: tipo })
    intentos[paso].push(pendiente)
    $('estado').className = ''
    $('estado').textContent = '¿Te gustó?'
    verPrevia(pendiente)
    pintar()
  }
  grabador.start(500)
  $('estado').className = 'grabando'
  $('estado').textContent = 'Grabando'
  pintar()
}

function aceptar() {
  if (!pendiente) return
  elegida[paso] = intentos[paso].indexOf(pendiente)
  pendiente = null
  $('previa').pause()
  $('previa').hidden = true
  $('estado').textContent = ''
  if (paso < FRASES.length - 1) paso++
  pintar()
}

// "Otra vez" no borra nada: el intento queda en la lista por si después te gusta más.
function repetir() {
  if (!pendiente) return
  pendiente = null
  $('previa').pause()
  $('previa').hidden = true
  $('estado').textContent = ''
  pintar()
}

function mover(d) {
  if (grabador || pendiente) return
  paso = Math.min(FRASES.length - 1, Math.max(0, paso + d))
  $('previa').hidden = true
  if (elegida[paso] >= 0) verPrevia(intentos[paso][elegida[paso]])
  pintar()
}

// Sube cada microtoma a una carpeta toma-N nueva y le pide al servidor que las una en cara.mp4.
async function guardar() {
  $('guardar').disabled = true
  $('estado').textContent = 'Guardando…'
  const ext = tipo.includes('mp4') ? 'mp4' : 'webm'
  try {
    let toma = null
    for (let i = 0; i < clips.length; i++) {
      const nombre = `frase-${String(i + 1).padStart(2, '0')}.${ext}`
      const r = await fetch(`/subir/${nombre}${toma ? `?toma=${toma}` : ''}`, { method: 'PUT', body: intentos[i][elegida[i]] })
      toma = (await r.json()).toma
      $('estado').textContent = `Guardando… ${i + 1} de ${clips.length}`
    }
    await fetch(`/subir/guion.json?toma=${toma}`, { method: 'PUT', body: JSON.stringify(FRASES) })
    const r = await fetch(`/unir/${toma}`, { method: 'POST' })
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status)
    $('estado').textContent = `Guardada como ${toma.replace('toma-', 'toma ')}. Ábrela en "Ver mis tomas".`
    paso = 0; pintar()
  } catch (e) {
    $('estado').textContent = 'No se pudo guardar: ' + e.message
  }
  $('guardar').disabled = false
}

$('grabar').onclick = grabarOParar
$('aceptar').onclick = aceptar
$('repetir').onclick = repetir
$('atras').onclick = () => mover(-1)
$('adelante').onclick = () => mover(1)
$('guardar').onclick = guardar
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) e.preventDefault()
  if (e.key === ' ') { e.preventDefault(); grabarOParar() }
  else if (e.key === 'Enter') { e.preventDefault(); aceptar() }
  else if (e.key.toLowerCase() === 'r') repetir()
  else if (e.key === 'ArrowRight') mover(1)
  else if (e.key === 'ArrowLeft') mover(-1)
})

pintar()
encender()
</script>
</body>
</html>
